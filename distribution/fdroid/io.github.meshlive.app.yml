# fdroiddata metadata draft (metadata/<applicationId>.yml) for MeshLive.
# The file name is the final applicationId, io.github.meshlive.app (`appId` in app/build.gradle.kts;
# docs/dev/architecture.md "Distribution and releases"). Companion file: distribution/fdroid/srclibs/libaom.yml (goes to fdroiddata srclibs/; libvpx is already there).
# Checked 2026-10-28 with fdroidserver 2.4.5 against current fdroiddata config (categories.yml, antiFeatures.yml):
# `fdroid readmeta` and `fdroid lint` clean. NOT yet run: `fdroid build` (needs the Linux buildserver image).
# See the notes at the end for what remains untested.
Categories:
  - Connectivity
  - Multimedia
  - Voice & Video Chat
License: GPL-3.0-or-later
AuthorName: The MeshLive Authors
WebSite: https://github.com/MeshLive/meshlive-android
SourceCode: https://github.com/MeshLive/meshlive-android
IssueTracker: https://github.com/MeshLive/meshlive-android/issues
Changelog: https://github.com/MeshLive/meshlive-android/releases

Name: MeshLive
AutoName: MeshLive

RepoType: git
Repo: https://github.com/MeshLive/meshlive-android.git

# Developer-signed reproducible publication (https://f-droid.org/docs/Reproducible_Builds/): F-Droid builds each
# entry, downloads the entry's `binary` and publishes OUR signed APK only when copying its signature onto F-Droid's
# unsigned build verifies (apksigcopier; bytes identical apart from the signature). A version whose comparison fails
# is skipped, never F-Droid-signed. The key is the release certificate (docs/user-guide.md "Verifying a release").
# `binary` must name FDROID-FLAVOUR assets (MeshLive-<version>-fdroid-<abi>.apk: :app:assembleFdroidRelease with this
# recipe's gradleprops and the release key, from the tagged source, attached to the GitHub release): the release page's
# MeshLive-<version>-<abi>.apk files are the github flavour (updater, REQUEST_INSTALL_PACKAGES) and can never match
# (tools/tests checks that no binary line names them). Same key means an F-Droid install and a GitHub install update
# each other; the F-Droid one carries no updater.
# `commit`: this draft names the release tag; the fdroiddata copy (metadata/io.github.meshlive.app.yml) names the
# full commit hash of that tag, which only exists once the tagged commit is made.
# Measured 2026-10-28 (Windows rebuild of the public v0.4.1-beta tag vs the signed 0.4.1-beta APKs): zip order and
# metadata, native libraries and resources identical; three differences, so the assets must be built
# (1) from the PUBLIC tag in a normal git clone, not from the private tree (the public export rewrites some Kotlin
#     string constants, so classes.dex differs) and not from a git worktree or source export (AGP 9 writes the commit
#     into META-INF/version-control-info.textproto in a clone, NO_VALID_GIT_FOUND elsewhere; releases after the
#     vcsInfo change in app/build.gradle.kts have no such file), and
# (2) with exactly this recipe's gradleprops (universalApk, see below).
AllowedAPKSigningKeys: 2eefc05a444522529d9f75d7ebcefd08864707f21a79041db51ebff83649e213

# Anti-features: none. No proprietary dependency (fdroidReleaseRuntimeClasspath: AndroidX, Material, Kotlin,
# kotlinx, ZXing; no Google Play Services, Firebase or Play libraries), no tracking, no ads, no network service.
# Media travels over Bluetooth only; INTERNET is declared for the optional local Wi-Fi Direct "Share app nearby" page.

# Flavour: `gradle: [fdroid]` builds the `fdroid` product flavour (app/build.gradle.kts `productFlavors`): no
# updater, no REQUEST_INSTALL_PACKAGES, no request of its own to GitHub. The `github` flavour is the release page's
# (opt-in updater); F-Droid must never ship it. The first tag with the flavours is v0.2.0-beta.
#
# One Builds entry per ABI APK: AGP's ABI splits make versionCode = base * 10 + 1 (armeabi-v7a) or + 2
# (arm64-v8a); `output` (relative to `subdir`) selects the one the entry publishes. universalApk=true although the
# universal APK (digit 0) is not published here: AGP's BuildConfig.VERSION_CODE (shown in About and in diagnostics)
# is the code of the variant's main output, which is the universal APK (70) when it is built and armeabi-v7a (71)
# otherwise, so classes.dex differs unless the gradleprops equal tools/make_release.py's (measured 2026-10-28).
Builds:
  - versionName: '0.5.0-beta'
    versionCode: 111
    commit: v0.5.0-beta
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y perl
    output: build/outputs/apk/fdroid/release/app-fdroid-armeabi-v7a-release-unsigned.apk
    binary: https://github.com/MeshLive/meshlive-android/releases/download/v%v/MeshLive-%v-fdroid-armeabi-v7a.apk
    srclibs:
      - libaom@0006e96cdb595ff88950a2c664115335ca5517bf
      - libvpx@6df3ec34557879fff673706f4a1d9fbd0f3a6f0e
    prebuild:
      # CMake 3.22.1 from the SDK (app/build.gradle.kts: externalNativeBuild.cmake.version).
      - sdkmanager --install "cmake;3.22.1"
      # libopus 1.5.2: the official release tarball, SHA-256-verified by the repository's own script
      # into ../reference-repos/libopus (prebuild runs in the subdir, the script's root is the repo).
      - python3 ../tools/fetch_native_sources.py --only libopus
      # libaom and libvpx: CMakeLists.txt defaults to reference-repos/<name>; point them at the srclib checkouts.
      # (fdroidserver substitutes $$srclib$$ in prebuild only, not in gradleprops.)
      - mkdir -p ../reference-repos
      - ln -sfn $$libaom$$ ../reference-repos/libaom
      - ln -sfn $$libvpx$$ ../reference-repos/libvpx
    gradle:
      - fdroid
    gradleprops:
      - splitAbis=true
      - enableArmeabiV7a=true
      - universalApk=true
    ndk: r28c

  - versionName: '0.5.0-beta'
    versionCode: 112
    commit: v0.5.0-beta
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y perl
    output: build/outputs/apk/fdroid/release/app-fdroid-arm64-v8a-release-unsigned.apk
    binary: https://github.com/MeshLive/meshlive-android/releases/download/v%v/MeshLive-%v-fdroid-arm64-v8a.apk
    srclibs:
      - libaom@0006e96cdb595ff88950a2c664115335ca5517bf
      - libvpx@6df3ec34557879fff673706f4a1d9fbd0f3a6f0e
    prebuild:
      - sdkmanager --install "cmake;3.22.1"
      - python3 ../tools/fetch_native_sources.py --only libopus
      - mkdir -p ../reference-repos
      - ln -sfn $$libaom$$ ../reference-repos/libaom
      - ln -sfn $$libvpx$$ ../reference-repos/libvpx
    gradle:
      - fdroid
    gradleprops:
      - splitAbis=true
      - enableArmeabiV7a=true
      - universalApk=true
    ndk: r28c

# Automatic updates: `checkupdates` (fdroidserver 2.4.5 checkupdates.py) copies the last len(VercodeOperation)
# Builds entries in order, so each ABI entry keeps its own `output` and `binary`; with `Tags` it sets `commit` to
# the matched tag and versionCode to each VercodeOperation result. UpdateCheckData reads the base versionCode.
# Only release tags count (v<major>.<minor>.<patch>, optionally -beta).
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$
UpdateCheckData: 'app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"(.+)"'
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
CurrentVersion: '0.5.0-beta'
CurrentVersionCode: 112

# libaom pin (srclibs/libaom.yml): commit 0006e96cdb595ff88950a2c664115335ca5517bf, a main-branch commit after
# the v3.14.1 tag (tag commit 03087864cf4bea6abb0d28f95cf7843511413d8f). tools/fetch_native_sources.py verifies
# the same commit plus a SHA-256 tree manifest; a libaom release tarball is NOT the same source. The pin must
# stay equal to NATIVE_SOURCES["libaom"]["commit"] in tools/fetch_native_sources.py (tools/tests checks it).
#
# libvpx pin (fdroiddata's existing srclibs/libvpx.yml, same Repo as distribution/fdroid/srclibs/libvpx.yml here,
# DECISIONS "Design VX"): commit 6df3ec34557879fff673706f4a1d9fbd0f3a6f0e, the commit of the v1.17.0 release tag;
# tools/fetch_native_sources.py verifies the same commit plus a SHA-256 tree manifest. Its build configuration is
# checked in (app/src/main/cpp/libvpx_config, tools/generate_libvpx_config.py), so the F-Droid build needs no libvpx
# configure step. The pin must stay equal to NATIVE_SOURCES["libvpx"]["commit"].
#
# libopus pin: tools/fetch_native_sources.py downloads
#   https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz and checks SHA-256
#   65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1 (xiph SHA256SUMS.txt).
# A git srclib for https://gitlab.xiph.org/xiph/opus.git at tag v1.5.2 would also need a Prepare step writing
# PACKAGE_VERSION="1.5.2" to package_version (CMakeLists.txt checks it) and differs from the tarball tree (UNTESTED).
#
# Notes for the build recipe and what is untested
# - AGP 9.4.1 (stable), Gradle 9.6.0 (wrapper, SHA-256 pinned; the same SHA-256 is in F-Droid's
#   gradle-transparency-log, which gradlew-fdroid uses, and gradlew-fdroid maps AGP 9.4 to Gradle 9.6.0), built-in
#   Kotlin (2.2.10), JDK 17, compileSdk/targetSdk 36 (platform 36 and build-tools 35+), NDK 28.2.13676358 (= r28c),
#   CMake 3.22.1. Dependencies are locked (app/gradle.lockfile, buildscript-gradle.lockfile) and checksummed
#   (gradle/verification-metadata.xml); the buildserver needs network access to Google Maven and Maven Central.
# - No keystore on the buildserver: Gradle then makes *-release-unsigned.apk, which is compared with `binary`.
# - Native paths: app/src/main/cpp/CMakeLists.txt maps the libopus, libaom (literal and REALPATH, so the symlinked
#   srclib), app-source and build directories with -ffile-prefix-map.
# - UNTESTED here: `fdroid build` itself (the sdkmanager/cmake step, the `ndk: r28c` install, the symlinked srclib),
#   and a Linux build against the Windows-built signed APK.
